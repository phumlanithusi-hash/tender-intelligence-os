name: Scheduled source scans

# Nothing in this application auto-updates on its own (confirmed
# 2026-10-01: no BullMQ/Redis, no Render cron job, no background
# worker anywhere in the codebase — see docs/INTEGRATION-STATUS.md's
# "Polling scheduler ... CONFIGURED, not ACTIVE" entry and
# lib/surveillance/schedule.ts's doc comment). Every scan has only
# ever run when a human manually executed `pnpm --filter api
# <adapter>:scan` on their own machine. This workflow is that missing
# scheduler: GitHub's runners have normal, unrestricted outbound
# network access (unlike this project's sandboxed dev environments),
# so it can reach the real government/SOE/aggregator sites directly
# and write straight to Supabase with the same scripts a human would
# run by hand.
#
# Each adapter runs as its own parallel matrix job — one source being
# down (e.g. a site outage) or slow must never block the other seven
# from updating. The run page lists each source's job with its own
# pass/fail, so a real outage is still visible, not swallowed.
on:
  schedule:
    # Every 6 hours. Adjust to taste — there is no cost to running
    # this more or less often beyond GitHub Actions minutes (this repo
    # is almost certainly under the free-tier allowance for a job this
    # short, run 4x/day).
    - cron: '0 */6 * * *'
  workflow_dispatch: {}

# Never let two scan batches overlap (e.g. a manual dispatch landing
# while the scheduled run is still going).
concurrency:
  group: scheduled-scans
  cancel-in-progress: false

jobs:
  # One parallel job per source, each with its own time budget — a
  # slow source (easyTenders and Eskom each take 10-15 minutes) can no
  # longer starve the others out of a shared job timeout, and one
  # source failing never blocks the rest (fail-fast: false).
  scan:
    name: Scan ${{ matrix.name }}
    runs-on: ubuntu-latest
    # easyTenders fetches a detail page per tender (~500), so it gets a
    # longer budget than the listing-only sources.
    timeout-minutes: ${{ matrix.timeout || 45 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: eTenders, script: etenders:scan }
          - { name: easyTenders, script: easytenders:scan, timeout: 90 }
          - { name: Tender Bulletins, script: tenderbulletins:scan }
          - { name: City of Joburg, script: joburg:scan }
          - { name: Eskom, script: eskom:scan }
          - { name: City of Cape Town, script: capetown:scan }
          - { name: Transnet, script: transnet:scan }
          - { name: TenderAlerts, script: tenderalerts:scan }
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Every adapter scrapes through playwright-core, which ships no
      # browser of its own — without this, every scan fails at
      # chromium.launch().
      - name: Install Chromium
        working-directory: apps/api
        run: pnpm exec playwright-core install --with-deps chromium

      - name: Scan
        working-directory: apps/api
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: pnpm ${{ matrix.script }}

  # Sources usually drop a tender from their listing once it closes,
  # so re-scans alone never mark it CLOSED. This sweep re-derives
  # every tender's status from its closing date — after all scans,
  # whether or not each one succeeded.
  refresh-status:
    name: Refresh tender statuses
    needs: scan
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Refresh statuses
        working-directory: apps/api
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: pnpm tenders:refresh-status
